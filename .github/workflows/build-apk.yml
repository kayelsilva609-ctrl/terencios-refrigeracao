
name: Gerar APK Terencios

on:
  workflow_dispatch:
  push:
    paths:
      - 'terencios-github-upload.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      
      - name: Instalar componentes Android
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Erro: sdkmanager não encontrado"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager
            exit 1
          fi

          echo "SDK Manager encontrado em: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"


     
      - name: Preparar projeto
        run: |
          unzip -o terencios-github-upload.zip
          cd terencios-src/frontend
          npm install
          npm install --no-save typescript@5.9.3
          

      - name: Gerar APK
        working-directory: terencios-src/frontend
        run: |
          npm run build
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Terencios-Refrigeracao-APK
          path: terencios-src/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          
