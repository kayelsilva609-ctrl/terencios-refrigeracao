
name: Gerar APK Terencios

on:
  workflow_dispatch:
  push:
    paths:
      - 'terencios-github-upload.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar projeto
        run: |
          unzip -o terencios-github-upload.zip
          cd terencios-src/frontend
          npm install

      - name: Gerar APK
        working-directory: terencios-src/frontend
        run: |
          npm run build
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Terencios-Refrigeracao-APK
          path: terencios-src/frontend/android/app/build/outputs/apk/debug/app-debug.apk
